# Ghostty Automator — Release
# Manual dispatch to create a version tag and trigger the build pipeline.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.3.0-auto.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip tag creation)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version
        run: |
          version="${{ inputs.version }}"
          if git tag -l "v$version" | grep -q "v$version"; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "Version: $version"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Trigger build pipeline
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cicd.yml --ref "v${{ inputs.version }}"

      - name: Summary
        run: |
          echo "## Release ${{ inputs.dry_run && '[DRY RUN] ' || '' }}v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — no tag created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tag pushed: v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Build pipeline triggered." >> "$GITHUB_STEP_SUMMARY"
          fi
