# Ghostty Automator — CI/CD Pipeline
# Triggered by version tags. Builds all platforms, creates GitHub release,
# updates Homebrew tap.

name: CI/CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ZIG_VERSION: "0.15.2"

jobs:
  # ==========================================================================
  # Build — macOS (Apple Silicon)
  # ==========================================================================
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build GhosttyKit
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false

      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          mkdir -p staging
          # Copy the .app bundle
          cp -R macos/build/Release/Ghostty.app staging/
          # Also copy the CLI binary for standalone use
          cp zig-out/bin/ghostty staging/ 2>/dev/null || true
          # Copy the skill
          cp -R skills staging/
          cd staging
          zip -r ../ghostty-automator-macos-arm64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-arm64
          path: ghostty-automator-macos-arm64.zip

  # ==========================================================================
  # Build — macOS (Intel)
  # ==========================================================================
  build-macos-x86_64:
    runs-on: macos-13  # Intel runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build GhosttyKit
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false

      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          mkdir -p staging
          cp -R macos/build/Release/Ghostty.app staging/
          cp zig-out/bin/ghostty staging/ 2>/dev/null || true
          cp -R skills staging/
          cd staging
          zip -r ../ghostty-automator-macos-x86_64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-x86_64
          path: ghostty-automator-macos-x86_64.zip

  # ==========================================================================
  # Build — Linux x86_64
  # ==========================================================================
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast

      - name: Package
        run: |
          mkdir -p staging/bin staging/skills staging/share
          cp zig-out/bin/ghostty staging/bin/
          cp -R skills/* staging/skills/
          # Terminfo, shell integration, etc.
          cp -R zig-out/share/* staging/share/ 2>/dev/null || true
          cd staging
          tar czf ../ghostty-automator-linux-x86_64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: ghostty-automator-linux-x86_64.tar.gz

  # ==========================================================================
  # Build — Linux arm64
  # ==========================================================================
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast

      - name: Package
        run: |
          mkdir -p staging/bin staging/skills staging/share
          cp zig-out/bin/ghostty staging/bin/
          cp -R skills/* staging/skills/
          cp -R zig-out/share/* staging/share/ 2>/dev/null || true
          cd staging
          tar czf ../ghostty-automator-linux-arm64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-arm64
          path: ghostty-automator-linux-arm64.tar.gz

  # ==========================================================================
  # GitHub Release
  # ==========================================================================
  github-release:
    needs: [build-macos-arm64, build-macos-x86_64, build-linux-x86_64, build-linux-arm64]
    uses: hyperb1iss/shared-workflows/.github/workflows/github-release.yml@main
    with:
      attach-artifacts: true
      artifact-pattern: 'binaries-*'
    secrets: inherit

  # ==========================================================================
  # Homebrew Tap Update
  # ==========================================================================
  homebrew:
    needs: [github-release]
    uses: hyperb1iss/shared-workflows/.github/workflows/homebrew-update.yml@main
    with:
      formula-name: ghostty-automator
      tap-repo: hyperb1iss/homebrew-tap
      description: "Ghostty with built-in terminal automation for AI agents"
      homepage: "https://github.com/hyperb1iss/ghostty-automator"
      binary-names: "ghostty"
    secrets: inherit
