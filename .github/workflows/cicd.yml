# Ghostty Automator — CI/CD Pipeline
# Triggered by version tags. Builds all platforms, creates GitHub release,
# updates Homebrew tap.
#
# Each build job produces two artifacts:
#   - binaries-${target}  → raw ghostty-automator binary, consumed by the
#                           shared homebrew-update workflow (which tars it
#                           and generates a `bin.install` formula).
#   - release-${target}   → per-platform tarball/zip with unique filename,
#                           consumed by the shared github-release workflow
#                           (which flattens all artifacts onto the release).

name: CI/CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ZIG_VERSION: "0.15.2"

jobs:
  # ==========================================================================
  # Build — macOS (Apple Silicon)
  # ==========================================================================
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Package — homebrew (CLI + share/ support payload)
        run: |
          mkdir -p brew-staging
          cp zig-out/bin/ghostty-automator brew-staging/
          if [ -d zig-out/share ]; then
            cp -R zig-out/share brew-staging/share
          fi

      - name: Package — release (app + CLI + skills)
        run: |
          mkdir -p rel-staging
          cp zig-out/bin/ghostty-automator rel-staging/
          if [ -d zig-out/Ghostty.app ]; then
            cp -R zig-out/Ghostty.app rel-staging/
          fi
          cp -R skills rel-staging/
          cd rel-staging
          zip -r ../ghostty-automator-macos-arm64.zip .

      - name: Upload binaries-macos-arm64
        uses: actions/upload-artifact@v7
        with:
          name: binaries-macos-arm64
          path: brew-staging/
          if-no-files-found: error

      - name: Upload release-macos-arm64
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: ghostty-automator-macos-arm64.zip
          if-no-files-found: error

  # ==========================================================================
  # Build — Linux x86_64
  # ==========================================================================
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast

      - name: Package — homebrew (CLI + share/ support payload)
        run: |
          mkdir -p brew-staging
          cp zig-out/bin/ghostty-automator brew-staging/
          if [ -d zig-out/share ]; then
            cp -R zig-out/share brew-staging/share
          fi

      - name: Package — release (full tarball with share/ and skills/)
        run: |
          pkg=ghostty-automator-linux-amd64
          mkdir -p "rel-staging/${pkg}/bin" \
                   "rel-staging/${pkg}/share" \
                   "rel-staging/${pkg}/skills"
          cp zig-out/bin/ghostty-automator "rel-staging/${pkg}/bin/"
          # Terminfo, shell integration, etc.
          if [ -d zig-out/share ]; then
            cp -R zig-out/share/. "rel-staging/${pkg}/share/"
          fi
          cp -R skills/. "rel-staging/${pkg}/skills/"
          (cd rel-staging && tar czf "../${pkg}.tar.gz" "${pkg}")

      - name: Upload binaries-linux-amd64
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-amd64
          path: brew-staging/
          if-no-files-found: error

      - name: Upload release-linux-amd64
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: ghostty-automator-linux-amd64.tar.gz
          if-no-files-found: error

  # ==========================================================================
  # Build — Linux arm64
  # ==========================================================================
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast

      - name: Package — homebrew (CLI + share/ support payload)
        run: |
          mkdir -p brew-staging
          cp zig-out/bin/ghostty-automator brew-staging/
          if [ -d zig-out/share ]; then
            cp -R zig-out/share brew-staging/share
          fi

      - name: Package — release (full tarball with share/ and skills/)
        run: |
          pkg=ghostty-automator-linux-arm64
          mkdir -p "rel-staging/${pkg}/bin" \
                   "rel-staging/${pkg}/share" \
                   "rel-staging/${pkg}/skills"
          cp zig-out/bin/ghostty-automator "rel-staging/${pkg}/bin/"
          if [ -d zig-out/share ]; then
            cp -R zig-out/share/. "rel-staging/${pkg}/share/"
          fi
          cp -R skills/. "rel-staging/${pkg}/skills/"
          (cd rel-staging && tar czf "../${pkg}.tar.gz" "${pkg}")

      - name: Upload binaries-linux-arm64
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-arm64
          path: brew-staging/
          if-no-files-found: error

      - name: Upload release-linux-arm64
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm64
          path: ghostty-automator-linux-arm64.tar.gz
          if-no-files-found: error

  # ==========================================================================
  # GitHub Release — uses the unique-named per-platform tarballs/zips
  # ==========================================================================
  github-release:
    needs: [build-macos-arm64, build-linux-x86_64, build-linux-arm64]
    uses: hyperb1iss/shared-workflows/.github/workflows/github-release.yml@main
    with:
      attach-artifacts: true
      artifact-pattern: 'release-*'
    secrets: inherit

  # ==========================================================================
  # Homebrew Tap Update — uses the raw binary-only artifacts
  # ==========================================================================
  homebrew:
    needs: [github-release]
    uses: hyperb1iss/shared-workflows/.github/workflows/homebrew-update.yml@main
    with:
      formula-name: ghostty-automator
      tap-repo: hyperb1iss/homebrew-tap
      description: "Ghostty with built-in terminal automation for AI agents"
      homepage: "https://github.com/hyperb1iss/ghostty-automator"
      binary-names: "ghostty-automator"
    secrets: inherit
