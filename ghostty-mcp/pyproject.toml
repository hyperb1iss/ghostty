[project]
name = "ghostty-mcp"
version = "0.1.0"
description = "MCP server and Python API for Ghostty terminal automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14",
    "anyio>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ghostty-mcp = "ghostty_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostty_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
